name: XMLFixer
options:
  bundleIdPrefix: com.xmlfixer
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.0"
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  XMLFixer:
    type: application
    platform: macOS
    sources:
      - path: XMLFixer
    settings:
      base:
        INFOPLIST_FILE: XMLFixer/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.xmlfixer.XMLFixer
        PRODUCT_NAME: Republic Wash & Cut
        PRODUCT_MODULE_NAME: XML_Fixer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_STYLE: Automatic
        # Developer ID / direct-download builds run unsandboxed so vendor CLIs
        # (REDline) can reach user media. The AppStore configuration re-enables
        # the sandbox with its own entitlements file.
        CODE_SIGN_ENTITLEMENTS: XMLFixer/XMLFixer.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        AppStore:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: XMLFixer/XMLFixer.AppStore.entitlements
          ENABLE_APP_SANDBOX: YES
    info:
      path: XMLFixer/App/Info.plist
      properties:
        CFBundleName: Republic Wash & Cut
        CFBundleDisplayName: Republic Wash & Cut
        CFBundleIdentifier: com.xmlfixer.XMLFixer
        CFBundleVersion: "14"
        CFBundleShortVersionString: "1.3.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "14.0"
        NSMainStoryboardFile: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: XML Document
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - public.xml
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
  XMLFixerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: XMLFixerTests
    dependencies:
      - target: XMLFixer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xmlfixer.XMLFixerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Republic Wash & Cut.app/Contents/MacOS/Republic Wash & Cut"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  XMLFixer:
    build:
      targets:
        XMLFixer: all
        XMLFixerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XMLFixerTests
    archive:
      config: Release
